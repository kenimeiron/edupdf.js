<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PDF 查看器 - 文件选择</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #2c3e50;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #1a2a3a;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ecf0f1;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            color: #3498db;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, button {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
        }
        input {
            background: #ecf0f1;
            margin-bottom: 10px;
        }
        button {
            background: #3498db;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        button:hover {
            background: #2980b9;
        }
        button:active {
            transform: scale(0.98);
        }
        .file-info {
            color: #ecf0f1;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            word-break: break-all;
        }
        hr {
            border-color: #3a5a6a;
            margin: 20px 0;
        }
        .preset-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .preset-btn {
            background: #3a5a6a;
            text-align: left;
        }
        .preset-btn:hover {
            background: #4a6a7a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 PDF 查看器</h1>
        
        <!-- 本地文件 -->
        <div class="section">
            <div class="section-title">📁 选择本地文件</div>
            <input type="file" id="localFileInput" accept=".pdf">
            <button id="openLocalBtn">📖 打开此 PDF</button>
        </div>
        
        <hr>
        
        <!-- 网络链接 -->
        <div class="section">
            <div class="section-title">🔗 输入链接</div>
            <input type="text" id="urlInput" placeholder="https://... 或 /path/to/file.pdf">
            <button id="openUrlBtn">🔗 打开链接</button>
        </div>
        
        <hr>
        
        <!-- 预设资料（可选） -->
        <div class="section">
            <div class="section-title">📚 快速打开</div>
            <div class="preset-list" id="presetList">
                <!-- 动态生成 -->
            </div>
        </div>
        
        <div class="file-info" id="fileInfo">
            选择文件后点击打开，将跳转到 PDF 查看器
        </div>
    </div>

    <script>
        // PDF.js 查看器路径（根据你的实际目录调整）
        const VIEWER_BASE = './pdfjs/2.15/web/viewer.html';
        
        // 预设文件列表
        const presets = [
            { name: "课课练 初中英语八下 双色版 答案", path: "/edupdf.js/example/课课练 初中英语八下 双色版 答案.pdf" },
            { name: "《补充习题 数学 八年级下册》参考答案", path: "/edupdf.js/example/《补充习题 数学 八年级下册》参考答案 （2026年春季）.pdf" }
        ];
        
        // 跳转到 PDF 查看器
        function openPdfViewer(pdfUrl, fileName = '') {
            if (!pdfUrl || pdfUrl.trim() === "") {
                alert("请提供有效的 PDF 地址");
                return false;
            }
            
            // 构建跳转 URL
            const viewerUrl = `${VIEWER_BASE}?file=${encodeURIComponent(pdfUrl)}`;
            
            // 在新标签页打开（或当前页，推荐新标签）
            window.location.href = viewerUrl;
            
            // 可选：更新提示信息
            const displayName = fileName || pdfUrl.split('/').pop() || pdfUrl;
            document.getElementById('fileInfo').innerHTML = `✅ 正在打开: ${displayName}<br>新标签页将显示 PDF`;
            
            console.log('跳转打开:', viewerUrl);
            return true;
        }
        
        // 处理本地文件：先创建 Blob URL，再跳转
        function openLocalFile(file) {
            if (!file || file.type !== 'application/pdf') {
                alert("请选择一个 PDF 文件");
                return false;
            }
            
            // 创建 Blob URL
            const blobUrl = URL.createObjectURL(file);
            
            // 跳转打开
            openPdfViewer(blobUrl, file.name);
            
            // 注意：Blob URL 会在新标签页关闭后自动释放
            // 如果需要手动释放，可以在新页面加载后延迟释放，但通常不需要
            return true;
        }
        
        // 处理网络链接
        function openUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert("请输入 PDF 网址");
                return false;
            }
            openPdfViewer(url);
            return true;
        }
        
        // ========== 渲染预设文件列表 ==========
        function renderPresets() {
            const container = document.getElementById('presetList');
            if (!container) return;
            container.innerHTML = '';
            
            presets.forEach(preset => {
                const btn = document.createElement('button');
                btn.textContent = `📘 ${preset.name}`;
                btn.className = 'preset-btn';
                btn.addEventListener('click', () => {
                    openPdfViewer(preset.path, preset.name);
                });
                container.appendChild(btn);
            });
        }
        
        // ========== 绑定事件 ==========
        
        // 本地文件打开
        const localInput = document.getElementById('localFileInput');
        const openLocalBtn = document.getElementById('openLocalBtn');
        
        openLocalBtn.addEventListener('click', () => {
            if (localInput.files && localInput.files.length > 0) {
                openLocalFile(localInput.files[0]);
            } else {
                alert("请先选择一个 PDF 文件");
            }
        });
        
        // 网络链接打开
        const openUrlBtn = document.getElementById('openUrlBtn');
        const urlInput = document.getElementById('urlInput');
        
        openUrlBtn.addEventListener('click', openUrl);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                openUrl();
            }
        });
        
        // 渲染预设列表
        renderPresets();
        
        console.log('📡 页面已启动，选择文件后将跳转打开');
    </script>
</body>
</html>
